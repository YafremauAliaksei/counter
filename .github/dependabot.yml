version: 2
updates:
  # Narzędzia deweloperskie (eslint, prettier). Produkcyjnych zależności
  # projekt nie ma i mieć nie powinien — artefakt musi być samowystarczalny.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      dev-tools:
        patterns: ['*']

  # Wersje akcji w workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
