name: Release

# Wydanie powstaje z TAGU, nie z ręcznego wgrania pliku. Dzięki temu to, co
# ludzie pobierają, na pewno pochodzi z kodu oznaczonego tym tagiem.
#
# Jak wydać — DWIE DROGI, obie kończą się tak samo (tagiem):
#
#   1. Z przeglądarki, bez konsoli: Releases -> Draft a new release ->
#      Choose a tag -> wpisać vX.Y.Z -> „Create new tag on publish” ->
#      Target: main -> Publish release. Opis zostawić pusty, wjedzie sekcja
#      z CHANGELOG. Rozdział „Wydania” w README opisuje to krok po kroku.
#      Przed tym krokiem wersja musi już siedzieć w main: package.json
#      podniesiony, artefakt przebudowany — czyli osobny commit wydania.
#
#   2. Z konsoli, jednym poleceniem na main:
#
#        npm version minor && git push --follow-tags
#
#      `npm version` podnosi package.json, potem uruchamia skrypt `version`
#      (`npm run build && git add counter.js`), a dopiero POTEM robi commit
#      i tag. Dzięki temu przebudowany artefakt wchodzi do tego samego
#      commita, na który wskazuje tag.
#
# Gdy przebieg padnie już PO utworzeniu tagu, nie trzeba wydawać nowej wersji:
# Actions -> Release -> Run workflow -> podać tag. Przebieg powtórzy się dla
# istniejącego tagu i uzupełni wydanie.
#
# Poprzednia wersja tej instrukcji mówiła „npm version, potem build, potem
# commit --amend”. To nie mogło zadziałać: amend tworzy NOWY commit, a tag
# zostaje na starym — czyli na kodzie, w którym artefakt ma jeszcze poprzednią
# wersję. Sprawdzenie „wersja w artefakcie zgadza się z tagiem” poniżej zapaliłoby
# się na czerwono przy pierwszym wydaniu.
#
# Reszta dzieje się tutaj.

on:
  push:
    tags:
      - 'v*.*.*'
  # Ręczne powtórzenie dla tagu, który już istnieje. Bez tego pola przebieg
  # ruszyłby z gałęzi, a wtedy GITHUB_REF_NAME to `main` i sprawdzenie wersji
  # padłoby na porównaniu „main” z numerem z package.json.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag istniejącego wydania, np. v1.2.0'
        required: true

permissions:
  contents: write
  # Poświadczenie pochodzenia artefaktu (attest-build-provenance) podpisuje się
  # tożsamością samego przebiegu, stąd te dwa dodatkowe uprawnienia.
  id-token: write
  attestations: write

jobs:
  release:
    name: Zbuduj i opublikuj
    runs-on: ubuntu-latest
    # Jedno miejsce, z którego bierze się nazwa tagu: przy tagu to ref
    # przebiegu, przy ręcznym uruchomieniu — to, co wpisał człowiek.
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Akcje przypięte do commita (SHA), a nie do ruchomego tagu v7: tag może
      # przestawić właściciel akcji albo ktoś, kto go przejmie — i nowy kod
      # jedzie wtedy sam do przebiegu z prawem zapisu do repozytorium. Tak
      # zadziałało przejęcie tj-actions/changed-files w marcu 2025. Dependabot
      # podnosi SHA razem z komentarzem wersji.
      #
      # persist-credentials: false — token NIE zostaje w .git/config. Inaczej
      # każdy kolejny krok, łącznie z akcją obcego autora, ma go pod ręką.
      # Jedyne miejsce, które go potrzebuje (przesunięcie gałęzi release),
      # dostaje go jawnie, tylko na czas jednego polecenia.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Wydajemy tylko to, co przechodzi te same bramki, co PR.
      - name: Bramki jakości
        run: |
          npm run build:check
          npm test

      - name: Wersja z tagu zgadza się z package.json
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG nie zgadza się z wersją w package.json ($PKG)."
            exit 1
          fi
          echo "Wersja: $PKG"

      - name: Wersja w artefakcie zgadza się z tagiem
        run: |
          PKG=$(node -p "require('./package.json').version")
          grep -q "SCRIPT_VERSION: '$PKG'" counter.js || {
            echo "::error file=counter.js::W artefakcie nie ma SCRIPT_VERSION: '$PKG'."
            exit 1
          }
          grep -q "@version      $PKG" counter.js || {
            echo "::error file=counter.js::Nagłówek ==UserScript== ma inną wersję niż package.json."
            exit 1
          }

      # Suma kontrolna jest dla człowieka: pozwala sprawdzić, czy plik w konsoli
      # to naprawdę ten, który wydano. Leci i jako osobny plik przy wydaniu,
      # i do treści opisu, żeby dało się ją porównać bez pobierania czegokolwiek.
      - name: Suma kontrolna artefaktu
        id: sum
        run: |
          SHA=$(sha256sum counter.js | cut -d' ' -f1)
          echo "$SHA  counter.js" > counter.js.sha256
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA-256: $SHA"

      - name: Wyciągnij opis wydania z CHANGELOG
        id: notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Sekcja od nagłówka tej wersji do następnego nagłówka drugiego poziomu.
          awk -v v="## $VERSION" '
            $0 ~ "^"v {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Sekcja kończy się separatorem `---` sprzed następnej wersji. Zostawiony,
          # dawał w wydaniu DWIE kreski jedna pod drugą — swoją i tę, którą
          # dokładamy w następnym kroku.
          awk '
            { line[NR] = $0 }
            END {
              last = NR
              while (last > 0 && (line[last] ~ /^[ \t]*$/ || line[last] ~ /^[ \t]*-{3,}[ \t]*$/)) last--
              for (i = 1; i <= last; i++) print line[i]
            }
          ' RELEASE_NOTES.md > RELEASE_NOTES.trimmed
          mv RELEASE_NOTES.trimmed RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Wydanie $VERSION. Szczegóły w CHANGELOG.md." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      # Dopisek jest CELOWO krótki i bez długich ciągów. Adres zakładki ma ponad
      # 200 znaków w jednej linii, więc w bloku kodu wychodził poza szerokość
      # strony wydania i trzeba go było przewijać w bok. Miejsce na niego jest
      # w README — tam stoi też wyjaśnienie, dlaczego wygląda tak, a nie inaczej.
      - name: Dopisz do opisu sposób uruchomienia i sumę kontrolną
        run: |
          VERSION=$(node -p "require('./package.json').version")
          REPO="${{ github.repository }}"
          cat >> RELEASE_NOTES.md <<NOTES

          ---

          ## Jak uruchomić

          Gotowy adres zakładki przeglądarki (bookmarklet) stoi w README, w rozdziale
          [Szybki start](https://github.com/$REPO/blob/v$VERSION/README.md#szybki-start).
          Ten adres wskazuje zawsze **ostatnie** wydanie, więc po każdym kolejnym
          wystarczy kliknąć zakładkę jeszcze raz — nic się nie podmienia ręcznie.

          Kto woli wklejać plik do konsoli, bierze go z listy plików tego wydania
          (niżej). Zakładka przypięta do **tej** wersji, bez dostawania kolejnych,
          bierze plik spod tagu: https://raw.githubusercontent.com/$REPO/v$VERSION/counter.js
          — zakładka musi pobierać właśnie spod \`raw.\`, bo adres pliku wydania
          na github.com nie przepuszcza zapytań międzydomenowych (CORS).

          ## Suma kontrolna

          \`\`\`
          SHA-256  ${{ steps.sum.outputs.sha }}
          \`\`\`
          NOTES

      # Poświadczenie pochodzenia: sprawdzalne stwierdzenie „ten plik powstał
      # w tym przebiegu, z tego commita”. Weryfikacja u odbiorcy:
      #   gh attestation verify counter.js --repo ${{ github.repository }}
      - name: Poświadcz pochodzenie artefaktu
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: counter.js

      # ==================================================================
      # GAŁĄŹ `release` — WSKAŹNIK „OSTATNIE WYDANIE” DLA ZAKŁADKI
      # ==================================================================
      # Zakładka pobiera plik przez `fetch` z cudzej strony, więc host musi
      # odpowiedzieć nagłówkiem Access-Control-Allow-Origin. github.com przy
      # pobieraniu pliku wydania odpowiada przekierowaniem BEZ tego nagłówka
      # (przeglądarka: „blocked by CORS policy”), raw.githubusercontent.com
      # wystawia `*`. Ale raw serwuje refy, nie wydania — stąd ta gałąź:
      # przesuwana tylko tutaj, czyli wskazuje wyłącznie na kod, który ktoś
      # świadomie wydał.
      #
      # Przesuwamy ją tylko wtedy, gdy wydawany tag jest najnowszy. Inaczej
      # ręczne powtórzenie przebiegu dla starego tagu cofnęłoby ludziom
      # skrypt do poprzedniej wersji.
      - name: Przesuń gałąź release na to wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEWEST=$(git tag --sort=-v:refname | head -n 1)
          if [ "$NEWEST" != "$RELEASE_TAG" ]; then
            echo "::notice::$RELEASE_TAG nie jest najnowszym tagiem ($NEWEST) — gałąź release zostaje bez zmian."
            exit 0
          fi
          # Postać base64 tokenu GitHub sam nie maskuje w logach — robimy to jawnie.
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              push origin "HEAD:refs/heads/release"
          echo "Gałąź release wskazuje teraz na $RELEASE_TAG."

      - name: Utwórz wydanie
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            counter.js
            counter.js.sha256
          draft: false
          prerelease: false
