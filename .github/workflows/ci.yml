name: CI

# Bramki jakości. Zielone mają być wszystkie — ale WYMUSZA to dopiero reguła
# ochrony gałęzi main (Settings -> Rules -> Rulesets), której plik nie ustawi.
# Bez niej czerwony przebieg jest tylko ostrzeżeniem i PR da się scalić mimo
# niego. Stan i instrukcja: HANDOFF.md, rozdział 2.4.
#
# Podział na cztery zadania jest celowy:
#   verify  — zero zależności, musi działać zawsze i wszędzie; to jest
#             prawdziwa bramka i to ją ustawia się jako "required check";
#   lint    — wymaga npm install, więc zależy od dostępności rejestru;
#   stand   — testy stanowiska w prawdziwym Chromium (npm run test:e2e);
#             potrzebuje rejestru i pobrania przeglądarki;
#   matrix  — sprawdza, że artefakt buduje się tak samo na Linuksie,
#             Windowsie i macOS (końce linii!) i na kilku wersjach Node.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testy i spójność artefaktu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Bez npm ci — projekt nie ma zależności potrzebnych do testów i budowania.
      - name: Artefakt zgadza się ze źródłami
        run: npm run build:check

      - name: Testy
        run: npm test

      # Skrypt liczy czas od godzin ściennych (zmiana, obiad), więc test może
      # zależeć od pory uruchomienia. Dwie dodatkowe strefy (UTC+14 i UTC-11)
      # sprawiają, że każdy przebieg sprawdza trzy różne pory dnia naraz,
      # za cenę dwóch sekund.
      - name: Testy o innych porach dnia
        run: |
          TZ=Pacific/Kiritimati npm test
          TZ=Pacific/Pago_Pago npm test

      # Ostatnia linia obrony przed rozjazdem: przebuduj naprawdę i sprawdź,
      # czy git widzi jakąkolwiek zmianę. build:check porównuje w pamięci,
      # to porównuje na dysku.
      - name: Przebudowa nie zmienia repozytorium
        run: |
          npm run build
          git diff --exit-code -- counter.js || {
            echo "::error file=counter.js::counter.js rozjechał się ze źródłami. Uruchom 'npm run build' i dołącz wynik do commita."
            exit 1
          }

  lint:
    name: Lint i format
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache działa, bo package-lock.json leży w repozytorium. ESLint 10
      # wymaga ^20.19 || ^22.13 || >=24 — stąd dolna granica w `engines`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # npm ci, a nie npm install: instaluje dokładnie to, co w pliku blokady,
      # i przerywa się, gdy blokada rozjedzie się z package.json.
      - name: Instalacja narzędzi
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  stand:
    name: Stanowisko w przeglądarce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Instalacja narzędzi
        run: npm ci --no-audit --no-fund

      # Wersja przeglądarki wynika z przypiętej wersji @playwright/test
      # w package-lock.json, więc każdy przebieg dostaje tę samą.
      - name: Przeglądarka
        run: npx playwright install --with-deps chromium

      # Do prawdziwej sieci testy nie wychodzą: każde zapytanie poza
      # stanowisko jest przechwytywane (tests/stand/specs/helpers.js).
      - name: Testy stanowiska
        run: npm run test:e2e

  matrix:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 20 to dolna granica z `engines` (choć już po końcu wsparcia) —
        # pilnuje, żeby build i testy nie sięgnęły po nowsze API. Starszych
        # wersji narzędzia repozytorium nie obsługują.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm run build:check
      - run: npm test
