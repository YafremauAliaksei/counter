name: CI

# Bramki jakości. Zielone mają być wszystkie — ale WYMUSZA to dopiero reguła
# ochrony gałęzi main (Settings -> Rules -> Rulesets), której plik nie ustawi.
# Bez niej czerwony przebieg jest tylko ostrzeżeniem i PR da się scalić mimo
# niego (audyt A1). Stan i instrukcja: HANDOFF.md, rozdział 2.4.
#
# Podział na trzy zadania jest celowy:
#   verify  — zero zależności, musi działać zawsze i wszędzie; to jest
#             prawdziwa bramka i to ją ustawia się jako "required check";
#   lint    — wymaga npm install, więc zależy od dostępności rejestru;
#   matrix  — sprawdza, że artefakt buduje się tak samo na Linuksie,
#             Windowsie i macOS (końce linii!) i na kilku wersjach Node.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Testy i spójność artefaktu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Bez npm ci — projekt nie ma zależności potrzebnych do testów i budowania.
      - name: Artefakt zgadza się ze źródłami
        run: npm run build:check

      - name: Testy
        run: npm test

      # Skrypt liczy czas od godzin ściennych (zmiana, obiad), więc test może
      # zależeć od pory, o której go uruchomiono. Tak było do 1.3.2: zestaw był
      # zielony ok. 7 godzin na dobę, a CI trafiał w zielone okno, bo pushe szły
      # wieczorem. Dwie dodatkowe strefy (UTC+14 i UTC-11) sprawiają, że każdy
      # przebieg sprawdza trzy różne pory dnia naraz, za cenę dwóch sekund.
      - name: Testy o innych porach dnia
        run: |
          TZ=Pacific/Kiritimati npm test
          TZ=Pacific/Pago_Pago npm test

      # Ostatnia linia obrony przed rozjazdem: przebuduj naprawdę i sprawdź,
      # czy git widzi jakąkolwiek zmianę. build:check porównuje w pamięci,
      # to porównuje na dysku.
      - name: Przebudowa nie zmienia repozytorium
        run: |
          npm run build
          git diff --exit-code -- counter.js || {
            echo "::error file=counter.js::counter.js rozjechał się ze źródłami. Uruchom 'npm run build' i dołącz wynik do commita."
            exit 1
          }

  lint:
    name: Lint i format
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache działa, bo package-lock.json leży w repozytorium. ESLint 10
      # wymaga ^20.19 || ^22.13 || >=24 — stąd dolna granica w `engines`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # npm ci, a nie npm install: instaluje dokładnie to, co w pliku blokady,
      # i przerywa się, gdy blokada rozjedzie się z package.json.
      - name: Instalacja narzędzi
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  matrix:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Node 18 wypadł w 1.3.3 (audyt K7): od kwietnia 2025 bez poprawek
        # bezpieczeństwa, a narzędzia repozytorium i tak go nie obsługują.
        # 20 zostaje jako dolna granica z `engines`, choć też jest już po
        # końcu wsparcia — pilnuje, żeby build i testy nie sięgnęły po nowsze API.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - run: npm run build:check
      - run: npm test
